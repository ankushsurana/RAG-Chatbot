<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="claude:viewport-fit-sides" content="cover">
  <title>RAG Chatbot</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2c1.2 7.8 6.2 12.8 14 14-7.8 1.2-12.8 6.2-14 14-1.2-7.8-6.2-12.8-14-14 7.8-1.2 12.8-6.2 14-14z' fill='%236fa8ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <svg width="0" height="0" class="sprite" aria-hidden="true">
    <defs>
      <symbol id="i-new" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V6M6 12l6-6 6 6"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M7 11l4-8a2.5 2.5 0 0 1 2.5 2.5V9h5.2a2 2 0 0 1 2 2.3l-1.2 8a2 2 0 0 1-2 1.7H7zM7 11H3v10h4"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M17 13l-4 8a2.5 2.5 0 0 1-2.5-2.5V15H5.3a2 2 0 0 1-2-2.3l1.2-8a2 2 0 0 1 2-1.7H17zM17 13h4V3h-4"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4"/></symbol>
    </defs>
  </svg>

  <div class="shell" id="shell">
    <aside class="sidebar" aria-label="Chats">
      <div class="brand">
        <svg class="spark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2c1.2 7.8 6.2 12.8 14 14-7.8 1.2-12.8 6.2-14 14-1.2-7.8-6.2-12.8-14-14 7.8-1.2 12.8-6.2 14-14z"/></svg>
        <strong>RAG Chatbot</strong>
        <button id="menu-close" class="icon-button mobile-only" type="button" aria-label="Close chat list"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <button id="new-chat" class="new-chat" type="button"><svg class="icon"><use href="#i-new"/></svg>New chat</button>
      <h2 class="history-label">Chats</h2>
      <div id="history" class="history"></div>
      <button id="open-pipeline" class="sidebar-link" type="button"><svg class="icon"><use href="#i-file"/></svg>How it works</button>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <main id="main" class="main is-empty">
      <button id="menu-open" class="icon-button mobile-only menu-button" type="button" aria-label="Open chat list"><svg class="icon"><use href="#i-menu"/></svg></button>

      <div id="scroller" class="scroller">
        <h1 id="greeting" class="greeting">What would you like to know?</h1>
        <div id="conversation" class="conversation" aria-live="polite"></div>
      </div>

      <div class="composer-area">
        <form id="ask-form" class="composer">
          <label class="sr-only" for="question">Your question</label>
          <textarea id="question" rows="1" maxlength="2000" placeholder="Ask anything about your documents"></textarea>
          <div class="composer-actions">
            <div class="scope">
              <label class="sr-only" for="scope">Documents to search</label>
              <select id="scope"><option value="">All documents</option></select>
              <svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg>
            </div>
            <button id="send" class="send" type="submit" aria-label="Send" disabled><svg class="icon"><use href="#i-send"/></svg></button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <dialog id="viewer" class="viewer" aria-labelledby="viewer-title">
    <header>
      <div>
        <strong id="viewer-title"></strong>
        <span id="viewer-page"></span>
      </div>
      <button id="viewer-close" class="icon-button" type="button" aria-label="Close page"><svg class="icon"><use href="#i-close"/></svg></button>
    </header>
    <div class="viewer-body">
      <p id="viewer-status" class="viewer-status" hidden></p>
      <img id="viewer-image" alt="Cited PDF page with the source passage highlighted">
    </div>
  </dialog>
  <dialog id="pipeline" class="viewer pipeline-dialog" aria-labelledby="pipeline-title">
    <header>
      <div>
        <strong id="pipeline-title">How the PDFs became searchable</strong>
        <span>The ingestion pipeline, with the real numbers for this library</span>
      </div>
      <button id="pipeline-close" class="icon-button" type="button" aria-label="Close"><svg class="icon"><use href="#i-close"/></svg></button>
    </header>
    <div id="pipeline-body" class="viewer-body pipeline-body"></div>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
