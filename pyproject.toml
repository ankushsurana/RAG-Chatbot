[project]
name = "ragbot"
version = "1.0.0"
description = "Low-latency RAG chatbot over large private PDF corpora, built on an open-source stack."
requires-python = ">=3.11,<3.13"
dependencies = [
    "chromadb>=1.0,<2",
    "fastapi>=0.115,<1",
    "fastembed>=0.5,<1",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "onnxruntime>=1.19,<2; sys_platform != 'win32'",
    "onnxruntime-directml>=1.19,<2; sys_platform == 'win32'",
    "py3langid>=0.3,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pymupdf>=1.24,<2",
    "rapidocr>=3.0,<4",
    "rich>=13",
    "tokenizers>=0.19,<1",
    "typer>=0.12,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
ragbot = "ragbot.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
# DirectML builds of ONNX Runtime provide the same module, so Windows needs only that one.
override-dependencies = ["onnxruntime; sys_platform != 'win32'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs downloaded models or a running LLM"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "E501"]
